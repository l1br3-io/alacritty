[workspace]
members = [
    "alacritty",
    "alacritty_terminal",
    "alacritty_config",
    "alacritty_config_derive",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85.0"

[profile.release]
lto = "thin"
debug = 1
incremental = false

[workspace.dependencies]
toml = "0.9.2"
toml_edit = "0.23.1"

# alacritty_terminal's OSC 133;D passthrough implements a Handler method
# that only exists in the dropterm vte fork; patch the workspace's vte so
# this repo builds and tests standalone. Downstream workspaces apply their
# own patch (or none) — this entry never escapes the workspace root.
[patch.crates-io]
vte = { git = "https://github.com/l1br3-io/vte", rev = "52dadb7b7ccc0429439c662490bd603824bd35c0" }
